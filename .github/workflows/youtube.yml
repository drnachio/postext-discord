name: YouTube → Discord

on:
  schedule:
    - cron: '7 * * * *' # hourly (private repos bill Actions minutes)
  workflow_dispatch:

jobs:
  post-new-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node youtube.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
